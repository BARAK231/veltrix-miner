<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>VELTRIX — VLX Miner</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0f14;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      max-width: 520px;
      margin: auto;
      min-height: 100vh;
      padding-bottom: 85px;
    }

    header {
      padding: 20px 18px 10px;
      text-align: center;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .sub {
      color: #8d98a5;
      margin-top: 5px;
      font-size: 13px;
    }

    .card {
      background: #121820;
      border: 1px solid #202b36;
      border-radius: 18px;
      margin: 12px 14px;
      padding: 18px;
    }

    .balance {
      text-align: center;
    }

    .balance-title {
      color: #8d98a5;
      font-size: 13px;
    }

    .balance-number {
      font-size: 36px;
      font-weight: 800;
      margin: 8px 0;
    }

    .vlx {
      color: #8d98a5;
    }

    .mining-box {
      text-align: center;
    }

    .mining-status {
      font-size: 14px;
      color: #8d98a5;
      margin-bottom: 8px;
    }

    .mining-number {
      font-size: 32px;
      font-weight: 800;
    }

    .rate {
      margin-top: 8px;
      color: #8d98a5;
      font-size: 13px;
    }

    .timer {
      margin: 15px 0;
      font-size: 22px;
      font-weight: 700;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 13px 18px;
      width: 100%;
      font-weight: 700;
      cursor: pointer;
      background: #fff;
      color: #000;
    }

    button:disabled {
      opacity: 0.45;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .task {
      background: #171f28;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .task-title {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .task-reward {
      color: #8d98a5;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .task-actions {
      display: flex;
      gap: 8px;
    }

    .task-actions button {
      width: 50%;
      padding: 10px;
    }

    .secondary {
      background: #27313d;
      color: #fff;
    }

    .friend-link {
      background: #0d131a;
      border: 1px solid #27313d;
      border-radius: 10px;
      padding: 12px;
      word-break: break-all;
      font-size: 12px;
      margin: 12px 0;
    }

    input {
      width: 100%;
      background: #0d131a;
      color: #fff;
      border: 1px solid #27313d;
      border-radius: 12px;
      padding: 13px;
      outline: none;
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .row > div {
      flex: 1;
      background: #171f28;
      border-radius: 12px;
      padding: 13px;
      text-align: center;
    }

    .small {
      color: #8d98a5;
      font-size: 12px;
    }

    .error {
      display: none;
      background: #4a1616;
      color: #ffb5b5;
      border: 1px solid #8e2b2b;
      border-radius: 12px;
      margin: 10px 14px;
      padding: 12px;
      font-size: 13px;
      word-break: break-word;
    }

    .success {
      color: #b8ffca;
      font-size: 13px;
      margin-top: 10px;
    }

    nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-width: 520px;
      margin: auto;
      background: #111820;
      border-top: 1px solid #202b36;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 8px 5px;
      z-index: 100;
    }

    nav button {
      background: transparent;
      color: #8d98a5;
      padding: 8px 2px;
      font-size: 11px;
    }

    nav button.active {
      color: #fff;
    }

    .rank-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #202b36;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">VELTRIX</div>
    <div class="sub">VLX MINER</div>
  </header>

  <div id="errorBox" class="error"></div>

  <!-- MINE -->
  <section id="mine" class="section active">

    <div class="card balance">
      <div class="balance-title">CLAIMED BALANCE</div>

    </div>

    <div class="card mining-box">
      <div class="mining-status">⛏️ MINING</div>

      <div id="mining" class="mining-number">
        0.0000
      </div>

      <div class="vlx">VLX</div>

      <div class="rate">
        ⚡ 4.74 VLX / hour
      </div>

      <div id="timer" class="timer">
        08:00:00
      </div>

      <button id="claimBtn" disabled>
        ⏳ MINING...
      </button>

      <div id="claimMessage"></div>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <div id="total">0.0000</div>

        </div>

        <div>
          <div>8h</div>

    </div>

  </section>

  <!-- TASKS -->
  <section id="tasks" class="section">

    <div class="card">
      <h3>🎯 Tasks</h3>
      <div id="taskList">Loading...</div>
    </div>

  </section>

  <!-- FRIENDS -->
  <section id="friends" class="section">

    <div class="card">
      <h3>👥 Friends</h3>

      <div class="row">
        <div>
          <div id="refCount">0</div>
          <div class="small">FRIENDS</div>
        </div>

        <div>
          <div>300</div>
          <div class="small">BONUS</div>
        </div>
      </div>

      <div id="refLink" class="friend-link">
        Loading...
      </div>

      <button id="copyRef">
        📋 Copy Referral Link
      </button>
    </div>

  </section>

  <!-- RANK -->
  <section id="rank" class="section">

    <div class="card">
      <h3>🏆 Rank</h3>
      <div id="leaderboard">Loading...</div>
    </div>

  </section>

  <!-- WALLET -->
  <section id="wallet" class="section">

    <div class="card">

      <h3>💰 Wallet</h3>

      <div class="small">
        EVM / ETH wallet address
      </div>

      <br>

      <input
        id="walletInput"
        placeholder="0x..."
        autocomplete="off"
      >

      <button id="saveWallet">
        💾 Save Wallet
      </button>

      <br><br>

      <div class="small">
        Minimum withdrawal: 10,000 VLX
      </div>

      <br>

      <input
        id="withdrawAmount"
        type="number"
        placeholder="Amount"
        min="10000"
      >

      <button id="withdrawBtn">
        🚀 Withdraw
      </button>

      <div id="withdrawMessage"></div>

    </div>

  </section>

</div>

<!-- NAV -->

<nav>

  <button class="navBtn active" data-section="mine">
    ⛏️<br>Mine
  </button>

  <button class="navBtn" data-section="tasks">
    🎯<br>Tasks
  </button>

  <button class="navBtn" data-section="friends">
    👥<br>Friends
  </button>

  <button class="navBtn" data-section="rank">
    🏆<br>Rank
  </button>

  <button class="navBtn" data-section="wallet">
    💰<br>Wallet
  </button>

</nav>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const initData = tg.initData;

let currentUser = null;
let timerInterval = null;

/* =========================
   API
========================= */

async function api(url, options = {}) {

  const headers = {
    "Content-Type": "application/json",
    "X-Telegram-Init-Data": initData,
    ...(options.headers || {})
  };

  const response = await fetch(url, {
    ...options,
    headers
  });

  const text = await response.text();

  let data;

  try {
    data = JSON.parse(text);
  } catch (e) {

    console.error(
      "Invalid JSON:",
      url,
      text
    );

    throw new Error(
      `Server returned invalid response (${response.status})`
    );
  }

  if (!response.ok) {
    throw new Error(
      data.error || "Request failed"
    );
  }

  return data;
}

/* =========================
   ERROR
========================= */

function showError(message) {

  const box =
    document.getElementById("errorBox");

  box.textContent = message;
  box.style.display = "block";
}

function clearError() {

  const box =
    document.getElementById("errorBox");

  box.textContent = "";
  box.style.display = "none";
}

/* =========================
   LOAD USER
========================= */

async function loadUser() {

  try {

    clearError();

    const params =
      new URLSearchParams(
        window.location.search
      );

    let ref =
      params.get("ref");

    if (!ref) {
      ref =
        tg.initDataUnsafe?.start_param || "";
    }

    const url =
      ref
        ? `/api/user?ref=${encodeURIComponent(ref)}`
        : `/api/user`;

    const user =
      await api(url);

    currentUser = user;

    updateUserUI();

    startMiningTimer();

  } catch (err) {

    console.error(err);

    showError(
      err.message
    );
  }
}

/* =========================
   UPDATE UI
========================= */

function updateUserUI() {

  if (!currentUser) return;

  document.getElementById(
    "balance"
  ).textContent =
    Number(currentUser.balance || 0)
      .toFixed(4);

  document.getElementById(
    "mining"
  ).textContent =
    Number(currentUser.mining || 0)
      .toFixed(4);

  document.getElementById(
    "total"
  ).textContent =
    Number(currentUser.total || 0)
      .toFixed(4);

  document.getElementById(
    "timer"
  ).textContent =
    formatTime(
      Number(currentUser.remaining || 0)
    );

  const claimBtn =
    document.getElementById(
      "claimBtn"
    );

  if (currentUser.canClaim) {

    claimBtn.disabled = false;
    claimBtn.textContent =
      "✅ CLAIM VLX";

  } else {

    claimBtn.disabled = true;
    claimBtn.textContent =
      "⏳ MINING...";
  }

  document.getElementById(
    "walletInput"
  ).value =
    currentUser.wallet || "";
}

/* =========================
   MINING TIMER
========================= */

function formatTime(seconds) {

  seconds =
    Math.max(
      0,
      Math.floor(seconds)
    );

  const h =
    Math.floor(seconds / 3600);

  const m =
    Math.floor(
      (seconds % 3600) / 60
    );

  const s =
    seconds % 60;

  return [
    h,
    m,
    s
  ]
    .map(
      x =>
        String(x).padStart(2, "0")
    )
    .join(":");
}

function startMiningTimer() {

  if (timerInterval) {
    clearInterval(timerInterval);
  }

  timerInterval =
    setInterval(
      async () => {

        if (!currentUser)
          return;

        if (
          Number(
            currentUser.remaining
          ) > 0
        ) {

          currentUser.remaining--;

          const elapsed =
            8 * 3600 -
            currentUser.remaining;

          currentUser.mining =
            Math.min(
              4.74 * (elapsed / 3600),
              37.92
            );

          currentUser.total =
            Number(
              currentUser.balance
            ) +
            Number(
              currentUser.mining
            );

          currentUser.canClaim =
            currentUser.remaining <= 0;

          updateUserUI();

        } else {

          currentUser.canClaim = true;

          currentUser.mining =
            37.92;

          currentUser.total =
            Number(
              currentUser.balance
            ) + 37.92;

          updateUserUI();
        }

      },
      1000
    );
}

/* =========================
   CLAIM
========================= */

document.getElementById(
  "claimBtn"
).addEventListener(
  "click",
  async () => {

    try {

      clearError();

      const btn =
        document.getElementById(
          "claimBtn"
        );

      btn.disabled = true;
      btn.textContent =
        "⏳ CLAIMING...";

      const result =
        await api(
          "/api/claim",
          {
            method: "POST",
            body: JSON.stringify({})
          }
        );

      currentUser =
        result.user;

      document.getElementById(
        "claimMessage"
      ).innerHTML =
        `<div class="success">
          ✅ ${Number(result.reward).toFixed(2)} VLX Claimed
        </div>`;

      updateUserUI();

      startMiningTimer();

    } catch (err) {

      showError(
        err.message
      );

      updateUserUI();
    }

  }
);


  /* =========================
   TASKS
========================= */

async function loadTasks() {

  try {

    const tasks =
      await api(
        "/api/tasks"
      );

    const list =
      document.getElementById(
        "taskList"
      );

    if (!tasks.length) {

      list.innerHTML =
        `<div class="small">
          No tasks available.
        </div>`;

      return;
    }

    list.innerHTML =
      tasks.map(
        task => {

          const claimed =
            task.claimed;

          const isXTask =
            task.type === "x_follow" ||
            task.type === "x_repost";

          return `
            <div class="task">

              <div class="task-title">
                ${escapeHtml(task.title)}
              </div>

              <div class="task-reward">
                🎁 ${Number(task.reward).toFixed(2)} VLX
              </div>

              <div class="task-actions">

                <button
                  class="secondary"
                  onclick="openTask('${escapeAttr(task.url)}')"
                >
                  ${isXTask ? "OPEN X" : "JOIN"}
                </button>

                <button
                  ${claimed ? "disabled" : ""}
                  onclick="${
                    claimed
                      ? ""
                      : isXTask
                        ? `verifyXTask(${task.id})`
                        : `claimTask(${task.id})`
                  }"
                >
                  ${claimed ? "CLAIMED" : "VERIFY"}
                </button>

              </div>

            </div>
          `;
        }
      ).join("");

  } catch (err) {

    document.getElementById(
      "taskList"
    ).textContent =
      err.message;
  }
}


function openTask(url) {

  window.open(
    url,
    "_blank"
  );
}


/* =========================
   NORMAL TELEGRAM TASK
========================= */

async function claimTask(taskId) {

  try {

    clearError();

    const result =
      await api(
        "/api/task/claim",
        {
          method: "POST",
          body: JSON.stringify({
            taskId
          })
        }
      );

    currentUser =
      result.user;

    updateUserUI();

    await loadTasks();

    tg.showAlert(
      `✅ ${Number(result.reward).toFixed(2)} VLX added`
    );

  } catch (err) {

    showError(
      err.message
    );
  }
}


/* =========================
   X TASK VERIFICATION
========================= */

async function verifyXTask(taskId) {

  try {

    clearError();

    const status =
      await api(
        "/api/x/status"
      );

    if (!status.connected) {

      tg.showAlert(
        "Connect your X account first."
      );
window.open(
  `/api/x/auth?initData=${encodeURIComponent(
    tg.initData
  )}`,
  "_blank"
);

      return;
    }

    const result =
      await api(
        "/api/x/verify-task",
        {
          method: "POST",
          body: JSON.stringify({
            taskId
          })
        }
      );

    currentUser =
      result.user;

    updateUserUI();

    await loadTasks();

    tg.showAlert(
      `✅ ${Number(result.reward).toFixed(2)} VLX added`
    );

  } catch (err) {

    showError(
      err.message
    );
  }
    }
      
/* =========================
   REFERRAL
========================= */

async function loadReferral() {

  try {

    const data =
      await api(
        "/api/referral"
      );

    document.getElementById(
      "refCount"
    ).textContent =
      data.count;

    document.getElementById(
      "refLink"
    ).textContent =
      data.link;

    document.getElementById(
      "copyRef"
    ).onclick =
      async () => {

        await navigator.clipboard.writeText(
          data.link
        );

        tg.showAlert(
          "Referral link copied!"
        );
      };

  } catch (err) {

    document.getElementById(
      "refLink"
    ).textContent =
      err.message;
  }
}

/* =========================
   LEADERBOARD
========================= */

async function loadLeaderboard() {

  try {

    const data =
      await api(
        "/api/leaderboard"
      );

    const box =
      document.getElementById(
        "leaderboard"
      );

    if (!data.length) {

      box.innerHTML =
        `<div class="small">
          No users yet.
        </div>`;

      return;
    }

    box.innerHTML =
      data.map(
        user => `
          <div class="rank-item">

            <div>
              #${user.rank}
              ${escapeHtml(
                user.first_name ||
                user.username ||
                "User"
              )}
            </div>

            <div>
              ${Number(
                user.balance
              ).toFixed(2)} VLX
            </div>

          </div>
        `
      ).join("");

  } catch (err) {

    document.getElementById(
      "leaderboard"
    ).textContent =
      err.message;
  }
}

/* =========================
   WALLET
========================= */

document.getElementById(
  "saveWallet"
).addEventListener(
  "click",
  async () => {

    try {

      clearError();

      const wallet =
        document.getElementById(
          "walletInput"
        ).value.trim();

      await api(
        "/api/wallet",
        {
          method: "POST",
          body: JSON.stringify({
            wallet
          })
        }
      );

      currentUser.wallet =
        wallet;

      tg.showAlert(
        "✅ Wallet saved"
      );

    } catch (err) {

      showError(
        err.message
      );
    }

  }
);

/* =========================
   WITHDRAW
========================= */

document.getElementById(
  "withdrawBtn"
).addEventListener(
  "click",
  async () => {

    try {

      clearError();

      const amount =
        Number(
          document.getElementById(
            "withdrawAmount"
          ).value
        );

      const result =
        await api(
          "/api/withdraw",
          {
            method: "POST",
            body: JSON.stringify({
              amount
            })
          }
        );

      currentUser =
        result.user;

      updateUserUI();

      document.getElementById(
        "withdrawMessage"
      ).innerHTML =
        `<div class="success">
          ✅ Withdrawal submitted — PENDING
        </div>`;

      document.getElementById(
        "withdrawAmount"
      ).value = "";

    } catch (err) {

      showError(
        err.message
      );
    }

  }
);

/* =========================
   NAVIGATION
========================= */

document.querySelectorAll(
  ".navBtn"
).forEach(
  button => {

    button.addEventListener(
      "click",
      async () => {

        const section =
          button.dataset.section;

        document.querySelectorAll(
          ".section"
        ).forEach(
          el =>
            el.classList.remove(
              "active"
            )
        );

        document.getElementById(
          section
        ).classList.add(
          "active"
        );

        document.querySelectorAll(
          ".navBtn"
        ).forEach(
          el =>
            el.classList.remove(
              "active"
            )
        );

        button.classList.add(
          "active"
        );

        if (section === "tasks")
          await loadTasks();

        if (section === "friends")
          await loadReferral();

        if (section === "rank")
          await loadLeaderboard();

      }
    );

  }
);

/* =========================
   ESCAPE
========================= */

function escapeHtml(value) {

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

function escapeAttr(value) {

  return String(value || "")
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    );
}

/* =========================
   START
========================= */

loadUser();

</script>

</body>

<div id="adminTaskList" style="margin-top:14px;"></div>

<script>
(function () {
  const ADMIN_ID = "6011583020";

  const tg = window.Telegram?.WebApp;
  if (!tg) return;

  tg.ready();

  const user = tg.initDataUnsafe?.user;

  if (user && String(user.id) === ADMIN_ID) {
    document.getElementById("adminTaskPanel").style.display = "block";
  }
})();

async function addVeltrixTask() {
  const tg = window.Telegram?.WebApp;
  const resultBox = document.getElementById("adminTaskResult");

  <script>
async function loadAdminTasks() {
  const tg = window.Telegram?.WebApp;
  const list = document.getElementById("adminTaskList");

  if (!tg || !list) return;

  try {
    const response = await fetch("/api/admin/tasks", {
      headers: {
        "X-Telegram-Init-Data": tg.initData
      }
    });

    const data = await response.json();

    if (!response.ok) {

    }

/* =========================
   ADD TASK
========================= */

async function addVeltrixTask() {

  const tg = window.Telegram?.WebApp;

  const resultBox =
    document.getElementById("adminTaskResult");

  const title =
    document.getElementById("adminTaskTitle")
      .value.trim();

  const url =
    document.getElementById("adminTaskUrl")
      .value.trim();

  const channel =
    document.getElementById("adminTaskChannel")
      .value.trim();

  const reward =
    Number(
      document.getElementById("adminTaskReward")
        .value
    );

  if (!title || !url) {

    resultBox.innerHTML =
      "❌ Title and URL are required";

    return;
  }

  try {

    const response =
      await fetch("/api/admin/task", {

        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "X-Telegram-Init-Data": tg.initData
        },

        body: JSON.stringify({
          title,
          url,
          channel,
          reward
        })

      });

    const data =
      await response.json();

    if (!response.ok) {

      resultBox.innerHTML =
        "❌ " +
        (data.error || "Failed");

      return;
    }

    resultBox.innerHTML =
      "✅ Task added successfully!";

    document.getElementById(
      "adminTaskTitle"
    ).value = "";

    await loadAdminTasks();

  } catch (err) {

    resultBox.innerHTML =
      "❌ " + err.message;

  }

}


/* =========================
   LOAD ADMIN TASKS
========================= */

async function loadAdminTasks() {

  const tg = window.Telegram?.WebApp;

  const list =
    document.getElementById("adminTaskList");

  if (!tg || !list) return;

  try {

    const response =
      await fetch("/api/admin/tasks", {

        headers: {
          "X-Telegram-Init-Data":
            tg.initData
        }

      });

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Failed to load tasks"
      );

    }

    if (!data.length) {

      list.innerHTML =
        `<div style="padding:10px;">
          No tasks found.
        </div>`;

      return;
    }

    list.innerHTML = `

      <h3>📋 Manage Tasks</h3>

      ${data.map(task => `

        <div
          style="
            padding:10px;
            margin:8px 0;
            background:#1f2937;
            border-radius:10px;
          "
        >

          <div style="font-weight:bold;">
            ${escapeHtml(task.title)}
          </div>

          <div
            style="
              font-size:13px;
              margin-top:4px;
            "
          >
            🎁 ${Number(task.reward).toFixed(2)} VLX
          </div>

          <div
            style="
              font-size:12px;
              color:#9ca3af;
              margin-top:4px;
              word-break:break-all;
            "
          >
            ${escapeHtml(task.url)}
          </div>

          <button
            onclick="deleteVeltrixTask(${task.id})"
            style="
              width:100%;
              padding:10px;
              margin-top:8px;
              border:0;
              border-radius:8px;
              background:#dc2626;
              color:white;
              font-weight:bold;
            "
          >
            🗑️ DELETE TASK
          </button>

        </div>

      `).join("")}

    `;

  } catch (err) {

    list.innerHTML =
      `<div style="color:#f87171;">
        ❌ ${escapeHtml(err.message)}
      </div>`;

  }

}


/* =========================
   DELETE TASK
========================= */

async function deleteVeltrixTask(taskId) {

  const tg = window.Telegram?.WebApp;

  if (!tg) return;

  if (
    !confirm(
      "Are you sure you want to delete this task?"
    )
  ) {
    return;
  }

  try {

    const response =
      await fetch(
        `/api/admin/task/${taskId}`,
        {
          method: "DELETE",

          headers: {
            "X-Telegram-Init-Data":
              tg.initData
          }
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Task deletion failed"
      );

    }

    alert(
      "✅ Task deleted successfully"
    );

    await loadAdminTasks();

  } catch (err) {

    alert(
      "❌ " + err.message
    );

  }

}


/* =========================
   CLEANUP DUPLICATES
========================= */

(function () {

  const ADMIN_ID = "6011583020";
  const tg = window.Telegram?.WebApp;

  if (!tg) return;

  tg.ready();

  const user =
    tg.initDataUnsafe?.user;

  if (
    !user ||
    String(user.id) !== ADMIN_ID
  ) {
    return;
  }

  const btn =
    document.createElement("button");

  btn.textContent =
    "🧹 REMOVE DUPLICATE TASKS";

  btn.style.cssText = `
    width:100%;
    padding:13px;
    margin:10px 0;
    border:0;
    border-radius:10px;
    background:#dc2626;
    color:white;
    font-weight:bold;
  `;

  btn.onclick = async function () {

    btn.disabled = true;
    btn.textContent = "⏳ Cleaning...";

    try {

      const response =
        await fetch(
          "/api/admin/task/cleanup",
          {
            method: "POST",

            headers: {
              "X-Telegram-Init-Data":
                tg.initData
            }
          }
        );

      const data =
        await response.json();

      if (!response.ok) {

        throw new Error(
          data.error ||
          "Cleanup failed"
        );

      }

      alert(
        "✅ Done!\n\n" +
        data.deactivated +
        " duplicate task(s) deactivated."
      );

      btn.textContent =
        "✅ DUPLICATES CLEANED";

    } catch (err) {

      alert(
        "❌ " + err.message
      );

      btn.disabled = false;

      btn.textContent =
        "🧹 REMOVE DUPLICATE TASKS";

    }

  };

  const panel =
    document.getElementById(
      "adminTaskPanel"
    );

  if (panel) {

    panel.appendChild(btn);

  }

})();
